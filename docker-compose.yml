# Jalankan: docker compose up -d --build  (via UI Dockge: Deploy)
# Tunnel dikelola config file lokal — tanpa dashboard, tanpa kartu kredit.
# disiapkan sekali via CLI (lihat DEPLOY.md): login → create → route dns.
# Kredensial di ./cloudflared/ (di-ignore git, jangan di-commit).
# (PORT default 8081 agar tidak tabrakan dengan frontend trac di 8080.)
services:
  porto:
    # Build lokal di VPS (cache layer membuat rebuild ±1 menit bila deps tak berubah).
    build: .
    image: porto-win8
    container_name: porto-win8
    restart: unless-stopped
    ports:
      # Hanya untuk cek lokal via curl; publik lewat tunnel, bukan port ini.
      - "127.0.0.1:${PORT:-8081}:80"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: porto-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - porto
