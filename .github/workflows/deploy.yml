name: Build & Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Application to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -eE

            dump_logs() {
              echo "===== DEPLOY FAILED ====="
              docker compose ps || true
              echo "--- porto (tail 100) ---"
              docker compose logs --tail=100 porto || true
              echo "--- tunnel (tail 50) ---"
              docker compose logs --tail=50 tunnel || true
            }
            trap dump_logs ERR

            echo "Navigating to project directory..."
            cd ${{ secrets.VPS_APP_DIR }}

            echo "Fetching and resetting to latest main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "Logging in to GHCR on VPS..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling latest Docker image from GHCR..."
            docker compose pull porto

            echo "Starting containers with updated image..."
            docker compose up -d porto tunnel

            echo "Cleaning up unused Docker images..."
            docker image prune -f

            echo "Deployment completed."
